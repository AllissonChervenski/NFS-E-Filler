name: Build Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build standalone ZIP
        shell: pwsh
        run: .\scripts\build-windows.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NfseFiller-Windows-x64
          path: dist/NfseFiller-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
