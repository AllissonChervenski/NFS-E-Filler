[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfse-filler"
version = "0.1.0"
description = "Assistente local de preenchimento de NFS-e para hospedagens"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
nfse-filler = "nfse_filler.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nfse_filler = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
